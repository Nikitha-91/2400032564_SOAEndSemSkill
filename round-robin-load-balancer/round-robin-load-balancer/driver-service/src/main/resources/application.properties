spring.application.name=driver-service
server.port=8080

# Backend microservices (order matters: index 0 -> Microservice-1, 1 -> Microservice-2, 2 -> Microservice-3)
driver.services.urls=http://localhost:8081,http://localhost:8082,http://localhost:8083

# HTTP timeouts (milliseconds) used when calling a microservice
driver.http.connect-timeout-ms=2000
driver.http.read-timeout-ms=5000
